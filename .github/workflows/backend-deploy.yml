name: Backend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy-image:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-deploy-image.yml
    id: build-deploy-image
  
  deploy:
    needs: build-deploy-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy Backend
        env:
          deploy_url: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
        run: |
           curl --fail --show-error --silent \
            --request POST \
            "$deploy_url"